name: Build BassGrab

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:          # lets you press "Run workflow" manually in the Actions tab

jobs:
  engine-test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bass-only tests (808 / saw, detuned, 44.1-48 kHz)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/test_analyzer.cpp -o test_analyzer
          ./test_analyzer
      - name: Melody-loop test (bass must be separated from lead + chords + hats)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/test_mix.cpp -o test_mix
          ./test_mix

  build:
    name: Plugin (${{ matrix.name }})
    needs: engine-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build
          - name: macOS
            os: macos-latest
            configure: cmake -B build -G Xcode
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: BassGrab-${{ matrix.name }}
          path: |
            build/BassGrab_artefacts/Release/VST3/
            build/BassGrab_artefacts/Release/Standalone/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
